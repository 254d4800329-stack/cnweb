<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ma Trận Kỹ Năng CNTT</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .banner-img{
            height: 400px;
            object-fit: cover;
        }

        .card img{
            height:200px;
            object-fit:cover;
        }
    </style>
</head>
<body>

<!-- MENU -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Kỹ Năng CNTT</a>
    </div>
</nav>

<!-- CAROUSEL -->
<div id="demo" class="carousel slide container mt-3" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner rounded">

        <div class="carousel-item active">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200"
                 class="d-block w-100 banner-img">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200"
                 class="d-block w-100 banner-img">
        </div>

        <div class="carousel-item">
            <img src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1200"
                 class="d-block w-100 banner-img">
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<!-- CARD -->
<div class="container mt-4">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=1200">
                <div class="card-body">
                    <h5>HTML</h5>
                    <p>Kỹ năng thiết kế giao diện web.</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?q=80&w=1200">
                <div class="card-body">
                    <h5>JavaScript</h5>
                    <p>Xử lý chức năng và tương tác.</p>
                </div>
            </div>
        </div>
<div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1200">
                <div class="card-body">
                    <h5>Bootstrap</h5>
                    <p>Tạo giao diện đẹp nhanh chóng.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- FORM -->
<div class="container mt-5">

    <h2 class="mb-4">Nhập Kỹ Năng CNTT</h2>

    <div class="row">

        <div class="col-md-6">

            <label>Tên công nghệ</label>
            <input type="text" id="ten" class="form-control">

        </div>

        <div class="col-md-6">

            <label>Năm ban hành</label>
            <input type="number" id="nam" class="form-control">

        </div>

    </div>

    <div class="row mt-3">

        <div class="col-md-6">

            <label>Mức độ (1-10)</label>
            <input type="number" id="mucdo" class="form-control">

        </div>

        <div class="col-md-6">

            <label>Ghi chú</label>
            <input type="text" id="ghichu" class="form-control">

        </div>

    </div>

    <button class="btn btn-primary mt-4" onclick="themKyNang()">
        Thêm kỹ năng
    </button>

</div>

<!-- TABLE -->
<div class="container mt-5">

    <h2>Danh Sách Kỹ Năng</h2>

    <table class="table table-bordered table-striped mt-3">

        <thead class="table-dark">
            <tr>
                <th>STT</th>
                <th>Tên công nghệ</th>
                <th>Năm</th>
                <th>Mức độ</th>
                <th>Ghi chú</th>
            </tr>
        </thead>

        <tbody id="bang"></tbody>

    </table>

</div>

<!-- TOAST -->
<div class="position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast">

        <div class="toast-header">
            <strong class="me-auto">Thông báo</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>

        <div class="toast-body">
            Hồ sơ năng lực rất ấn tượng
        </div>

    </div>
</div>

<script>

    let ds = [];

    // SỬA ĐOẠN CODE DEBUG
    function addCourse(newCourse, list) {

        // MSSV kết thúc số lẻ -> chèn đầu
        // MSSV kết thúc số chẵn -> chèn cuối

        let mssv = "23010001";

        if (mssv % 2 != 0) {
            list.unshift(newCourse);
        } else {
            list.push(newCourse);
        }

        renderTable(list);
    }

    // THÊM KỸ NĂNG
    function themKyNang(){

        let ten = document.getElementById("ten").value;
        let nam = document.getElementById("nam").value;
        let mucdo = Number(document.getElementById("mucdo").value);
        let ghichu = document.getElementById("ghichu").value;

        let skill = {
            ten,
            nam,
            mucdo,
            ghichu
        };
addCourse(skill, ds);

        // KIỂM TRA > 15
        let dem = 0;

        for(let i = 0; i < ds.length; i++){

            if(ds[i].mucdo > 7){
                dem++;
            }

        }

        if(dem > 15){

            let toast = new bootstrap.Toast(document.getElementById('liveToast'));
            toast.show();

        }

        // RESET FORM
        document.getElementById("ten").value = "";
        document.getElementById("nam").value = "";
        document.getElementById("mucdo").value = "";
        document.getElementById("ghichu").value = "";

    }

    // HIỂN THỊ BẢNG
    function renderTable(list){

        let html = "";

        for(let i = 0; i < list.length; i++){

            html += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${list[i].ten}</td>
                    <td>${list[i].nam}</td>
                    <td>${list[i].mucdo}</td>
                    <td>${list[i].ghichu}</td>
                </tr>
            `;
        }

        document.getElementById("bang").innerHTML = html;
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
