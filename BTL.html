<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma Trận Kỹ Năng CNTT</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <div class="container mt-4">

        <h1 class="text-center text-primary">
            MA TRẬN KỸ NĂNG CNTT
        </h1>

        <p class="text-center">
            Website quản lý kỹ năng cá nhân
        </p>

    </div>


    <!-- THÔNG TIN -->
    <div class="container mt-4">

        <div class="card p-4">

            <center>

                <img src="4.jpg"
                     width="150"
                     height="150">

                <h3 class="mt-3">
                    Nguyễn Văn A
                </h3>

                <p>
                    Sinh viên ngành Công nghệ thông tin
                </p>

                <p>
                    HTML, CSS, JavaScript, Bootstrap
                </p>

            </center>

        </div>

    </div>


    <!-- FORM -->
    <div class="container mt-5">

        <div class="card">

            <div class="card-header bg-success text-white">

                FORM NHẬP KỸ NĂNG

            </div>

            <div class="card-body">

                <form id="skillForm">

                    <div class="row">

                        <!-- MSSV -->
                        <div class="col-md-4 mb-3">

                            <label>Mã số sinh viên</label>

                            <input type="number"
                                   id="mssv"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- HỌ TÊN -->
                        <div class="col-md-4 mb-3">

                            <label>Họ tên sinh viên</label>

                            <input type="text"
                                   id="hoten"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- TÍN CHỈ -->
                        <div class="col-md-4 mb-3">

                            <label>Số tín chỉ</label>

                            <input type="number"
                                   id="tinchi"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- CÔNG NGHỆ -->
                        <div class="col-md-3 mb-3">

                            <label>Tên công nghệ</label>

                            <input type="text"
                                   id="ten"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- NĂM -->
                        <div class="col-md-3 mb-3">

                            <label>Năm ban hành</label>

                            <input type="number"
                                   id="nam"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- MỨC ĐỘ -->
                        <div class="col-md-3 mb-3">

                            <label>Mức độ</label>

                            <input type="number"
                                   id="mucdo"
                                   class="form-control"
                                   required>

                        </div>


                        <!-- GHI CHÚ -->
                        <div class="col-md-3 mb-3">

                            <label>Ghi chú</label>

                            <input type="text"
                                   id="ghichu"
                                   class="form-control">

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-success">

                        Thêm kỹ năng

                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- BẢNG -->
    <div class="container mt-5">

        <table class="table table-bordered text-center">

            <thead class="table-dark">

                <tr>

                    <th>STT</th>
                    <th>MSSV</th>
                    <th>Họ tên</th>
                    <th>Tín chỉ</th>
                    <th>Công nghệ</th>
                    <th>Năm</th>
                    <th>Mức độ</th>
                    <th>Ghi chú</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>


    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="liveToast"
             class="toast text-bg-success">

            <div class="toast-body">

                Hồ sơ năng lực rất ấn tượng!

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- File JS -->
    <script>
        // Mảng lưu dữ liệu
let skillList = [];


// Lấy form
const form = document.getElementById("skillForm");


// Khi submit form
form.addEventListener("submit", function(e){

    // Không reload trang
    e.preventDefault();


    // Lấy dữ liệu từ form
    let mssv = document.getElementById("mssv").value;

    let hoten = document.getElementById("hoten").value;

    let tinchi = document.getElementById("tinchi").value;

    let ten = document.getElementById("ten").value;

    let nam = document.getElementById("nam").value;

    let mucdo = document.getElementById("mucdo").value;

    let ghichu = document.getElementById("ghichu").value;


    // Tạo object
    let newCourse = {

        mssv,
        hoten,
        tinchi,
        ten,
        nam,
        mucdo,
        ghichu

    };


    // Gọi hàm thêm dữ liệu
    addCourse(newCourse, skillList);

    // Reset form
    form.reset();

});



// Hàm thêm dữ liệu
function addCourse(newCourse, list) {

    // MSSV lẻ -> thêm đầu
    if (newCourse.mssv % 2 !== 0) {

        list.unshift(newCourse);

    }

    // MSSV chẵn -> thêm cuối
    else {

        list.push(newCourse);

    }

    // Hiển thị bảng
    renderTable(list);

    // Kiểm tra tổng
    checkTotal(list);

}



// Hàm hiển thị bảng
function renderTable(list){

    let tableBody =
        document.getElementById("tableBody");

    tableBody.innerHTML = "";


    list.forEach(function(item, index){

        tableBody.innerHTML += `

        <tr>

            <td>${index + 1}</td>

            <td>${item.mssv}</td>

            <td>${item.hoten}</td>

            <td>${item.tinchi}</td>

            <td>${item.ten}</td>

            <td>${item.nam}</td>

            <td>${item.mucdo}</td>

            <td>${item.ghichu}</td>

        </tr>

        `;

    });

}



// Hàm kiểm tra tổng mức độ
function checkTotal(list){

    let total = 0;


    list.forEach(function(item){

        total += Number(item.mucdo);

    });


    // Nếu tổng > 15
    if(total > 15){

        const toastElement =
            document.getElementById("liveToast");

        const toast =
            new bootstrap.Toast(toastElement);

        toast.show();

    }

}
    </script>

</body>

</html>
